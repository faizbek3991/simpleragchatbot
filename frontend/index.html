<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FARM Assistant (FAQ)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="card">
  <h1>FARM Assistant (FAQ)</h1>
  <div id="chat" class="chat"></div>
  <div class="row">
    <input id="question" placeholder="Type your question..." autocomplete="off">
    <button id="askBtn" onclick="askQuestion()">Ask</button>
  </div>
  <p class="hint">Try: What is FARM? • Who is the trainer? • What time does class start?</p>
</main>
<script src="app.js"></script>
</body>
</html>
